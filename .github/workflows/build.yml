name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build'
        required: true
        default: '1.X.X'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create directory structure
        run: |
          mkdir -p nxm-collection-dl
          cp __init__.py nxm-collection-dl/
          cp __meta__.py nxm-collection-dl/
          cp api.py nxm-collection-dl/
          cp collection_helpers.py nxm-collection-dl/
          cp download.py nxm-collection-dl/
          cp install.py nxm-collection-dl/
          cp var.py nxm-collection-dl/
          cp -R icons/ nxm-collection-dl/
          cp LICENSE nxm-collection-dl/
          cp README.md nxm-collection-dl/

      - name: Validate release archive contents
        run: |
          required_files=(
            "__init__.py"
            "__meta__.py"
            "api.py"
            "collection_helpers.py"
            "download.py"
            "install.py"
            "var.py"
            "icons/download.ico"
            "icons/install.ico"
            "LICENSE"
            "README.md"
          )
          for file in "${required_files[@]}"; do
            test -f "nxm-collection-dl/${file}"
          done

      - name: Create release archive
        run: |
          zip -r nxm-collection-dl-${{ github.event.inputs.version }}.zip nxm-collection-dl/

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: "${{ github.event.inputs.version }}"
          body: "NXM Collection Downloader v${{ github.event.inputs.version }}"
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: nxm-collection-dl-${{ github.event.inputs.version }}.zip
          asset_name: nxm-collection-dl-${{ github.event.inputs.version }}.zip
          asset_content_type: application/zip
